<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>禅</title>
<style>
:root{color-scheme:dark;--gold:#e7b85f;--muted:#776f64;--surface:rgba(255,255,255,.055)}
*{box-sizing:border-box;margin:0;padding:0}button{font:inherit}body{min-width:200px;min-height:200px;height:100vh;overflow:hidden;user-select:none;background:radial-gradient(circle at 50% 42%,#282119 0,#141210 50%,#090909 100%);color:#eadcc8;font-family:"LXGW WenKai","Noto Serif SC","Source Han Serif SC",serif}
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden}.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,194,112,.14);animation:rise linear infinite}@keyframes rise{from{transform:translateY(20vh);opacity:0}15%{opacity:1}to{transform:translateY(-120vh);opacity:0}}
.app{width:100%;height:100%;position:relative}.page{position:absolute;inset:0;padding:clamp(10px,3vh,24px);display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateX(18px);pointer-events:none;transition:.28s ease}.page.active{opacity:1;transform:none;pointer-events:auto}
.brand{text-align:center;flex:0 0 auto}.brand h1{font-size:clamp(20px,4vh,28px);font-weight:400;letter-spacing:.42em;margin-left:.42em;text-shadow:0 0 24px rgba(231,184,95,.3)}.subtitle{margin-top:3px;color:var(--muted);font-size:clamp(9px,1.8vh,12px);letter-spacing:.18em}
.home{justify-content:center;gap:clamp(10px,2.8vh,22px)}.home-logo{width:min(170px,38vw,27vh);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}.menu{display:grid;grid-template-columns:repeat(2,minmax(120px,160px));gap:12px}.menu-card{appearance:none;border:1px solid rgba(231,184,95,.14);border-radius:18px;padding:15px 12px;background:var(--surface);color:#e8d5b7;cursor:pointer;text-align:left;transition:.2s}.menu-card:hover{transform:translateY(-2px);border-color:rgba(231,184,95,.38);background:rgba(255,255,255,.08)}.menu-icon{font-size:25px}.menu-title{display:block;margin-top:7px;font-size:15px}.menu-desc{display:block;margin-top:3px;color:#746d64;font-size:10px}
.tool{gap:clamp(7px,1.4vh,13px)}.tool-head{width:min(390px,94vw);display:grid;grid-template-columns:48px 1fr 48px;align-items:center;flex:0 0 auto}.back{appearance:none;width:36px;height:36px;border:1px solid rgba(231,184,95,.13);border-radius:50%;background:rgba(0,0,0,.2);color:#b7a58e;cursor:pointer;font-size:18px}.tool-title{text-align:center}.tool-title h2{font-size:clamp(16px,3vh,22px);font-weight:400;letter-spacing:.18em}.tool-title span{display:block;margin-top:2px;color:#655e56;font-size:10px}
.content{flex:1 1 auto;min-height:0;width:min(390px,94vw);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,1vh,9px)}.visual{position:relative;width:min(270px,64vw,47vh);height:min(250px,59vw,44vh);display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}.visual svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 12px 12px rgba(0,0,0,.34))}
.fish.hit svg{animation:knock .3s ease-out}@keyframes knock{20%{transform:rotate(-2deg) scale(.96)}48%{transform:rotate(1.5deg) scale(1.01)}}.mallet{transform-origin:218px 54px}.fish.hit .mallet{animation:strike .3s ease-out}@keyframes strike{25%{transform:rotate(22deg)}55%{transform:rotate(-10deg)}}
.flash{position:absolute;z-index:2;inset:23%;border:2px solid rgba(240,194,104,.65);border-radius:50%;opacity:0;pointer-events:none}.hit .flash,.relit .flash{animation:flash .7s ease-out}@keyframes flash{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(1.65)}}.float{position:absolute;z-index:10;left:50%;top:38%;transform:translate(-50%,-50%);color:#ffe097;font-size:22px;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;text-shadow:0 0 12px rgba(240,184,72,.8),0 2px 5px rgba(0,0,0,.9)}.hit .float,.relit .float{animation:floatText .85s ease-out}@keyframes floatText{0%{opacity:1;transform:translate(-50%,-20%) scale(.7)}35%{opacity:1;transform:translate(-50%,-80%) scale(1.08)}to{opacity:0;transform:translate(-50%,-160%) scale(.9)}}
.incense .smoke{opacity:0}.incense.burning .smoke{opacity:.7;stroke-dasharray:16 11;animation:smoke 2.8s linear infinite}@keyframes smoke{to{stroke-dashoffset:-54}}.incense .ember{opacity:0}.incense.burning .ember{opacity:1;animation:flicker .35s ease-in-out infinite alternate}@keyframes flicker{to{filter:drop-shadow(0 0 6px #ff7b36)}}
.stats{text-align:center;flex:0 0 auto}.number{display:inline-block;color:#ffd36c;font-size:clamp(28px,6.5vh,46px);line-height:1;font-weight:700;text-shadow:0 0 20px rgba(255,205,93,.25)}.number.pop{animation:pop .25s ease-out}@keyframes pop{50%{transform:scale(1.3);color:#fff2bd}}.label{margin-top:3px;color:#756d63;font-size:12px}.status{height:16px;margin-top:2px;color:#8b7f71;font-size:10px}.hint{flex:0 0 auto;color:#4f4942;font-size:10px;letter-spacing:.08em}
@media(max-width:400px),(max-height:500px){.page{padding:7px}.home{gap:7px}.subtitle,.hint,.menu-desc{display:none}.home-logo{width:min(112px,33vw,25vh)}.menu-card{padding:9px 10px}.menu-icon{font-size:18px}.menu-title{font-size:12px}.tool{gap:3px}.tool-head{grid-template-columns:36px 1fr 36px}.back{width:29px;height:29px}.visual{width:min(190px,61vw,43vh);height:min(176px,57vw,40vh)}.number{font-size:27px}.date{display:none}}
@media(max-width:260px),(max-height:260px){.brand h1{font-size:15px}.home-logo{width:62px}.menu{gap:5px;grid-template-columns:repeat(2,88px)}.menu-card{padding:6px}.menu-icon{font-size:14px}.menu-title{font-size:10px;margin-top:2px}.tool-title span,.status{display:none}.visual{width:min(130px,58vw,55vh);height:min(120px,54vw,51vh)}.number{font-size:21px}.label{font-size:9px}}
</style>
</head>
<body><div class="particles" id="particles"></div><main class="app">
<section class="page home active" data-page="home">
  <div class="brand"><h1>禅</h1><div class="subtitle">赛博修行 · 片刻清净</div></div>
  <img class="home-logo" src="/icon.png" alt="禅：打坐人物标志"/>
  <nav class="menu" aria-label="修行功能">
    <button class="menu-card" data-open="fish"><span class="menu-icon">◉</span><span class="menu-title">赛博木鱼</span><span class="menu-desc">一敲一念，功德随喜</span></button>
    <button class="menu-card" data-open="incense"><span class="menu-icon">♨</span><span class="menu-title">赛博烧香</span><span class="menu-desc">敬上三炷香，静心三分钟</span></button>
  </nav>
</section>
<section class="page tool" data-page="fish">
  <header class="tool-head"><button class="back" aria-label="返回菜单">‹</button><div class="tool-title"><h2>赛博木鱼</h2><span>一敲一念 · 功德随喜</span></div><i></i></header>
  <div class="content"><div class="visual fish" id="fish" role="button" tabindex="0" aria-label="敲木鱼"><div class="flash"></div><div class="float" id="fishFloat">功德 +1</div>
    <svg viewBox="0 0 280 250" aria-hidden="true"><defs><radialGradient id="fishWood" cx="48%" cy="30%" r="70%"><stop stop-color="#efb66f"/><stop offset=".52" stop-color="#b96e31"/><stop offset="1" stop-color="#673518"/></radialGradient><linearGradient id="malletWood" x2="1" y2="1"><stop stop-color="#e5aa5c"/><stop offset="1" stop-color="#713a18"/></linearGradient></defs>
      <ellipse cx="135" cy="204" rx="101" ry="18" fill="#090807" opacity=".45"/><path d="M29 165C39 73 92 25 168 31c44 3 72 29 83 67L103 124c-18 3-22 27-8 38 16 12 34 5 45-2l112-56c4 42-9 80-44 98-31 16-116 13-156-5-18-8-26-18-23-32Z" fill="url(#fishWood)" stroke="#663719" stroke-width="3" stroke-linejoin="round"/><path d="M102 124 251 98c2 7 2 12 1 18L138 160c-19 9-37 9-47-2-11-12-6-30 11-34Z" fill="#321508"/><path d="M36 160c-17 3-22 17-14 30 5 8 18 7 30 7-15-10-20-22-16-37Z" fill="#8e4c22"/>
      <g class="mallet"><rect x="176" y="38" width="10" height="113" rx="5" fill="url(#malletWood)" transform="rotate(30 181 94)"/><ellipse cx="218" cy="44" rx="24" ry="18" fill="url(#fishWood)" transform="rotate(30 218 44)"/></g></svg>
  </div><div class="stats"><div class="number" id="fishCount">0</div><div class="label">今日已敲</div><div class="status sharedDate"></div></div></div><div class="hint">点击木鱼，或按空格键</div>
</section>
<section class="page tool" data-page="incense">
  <header class="tool-head"><button class="back" aria-label="返回菜单">‹</button><div class="tool-title"><h2>赛博烧香</h2><span>三炷清香 · 三分钟静心</span></div><i></i></header>
  <div class="content"><div class="visual incense" id="incense" role="button" tabindex="0" aria-label="点燃三炷香"><div class="flash"></div><div class="float" id="incenseFloat">清净 +1</div>
    <svg viewBox="0 0 280 250" aria-hidden="true"><defs><linearGradient id="bronze" x2="0" y2="1"><stop stop-color="#dda753"/><stop offset=".5" stop-color="#885027"/><stop offset="1" stop-color="#3b2114"/></linearGradient></defs>
      <g id="smokes"><path class="smoke" data-smoke="0" d="M112 78c-22-14 16-31-3-48" fill="none" stroke="#d8f3ec" stroke-width="3" stroke-linecap="round"/><path class="smoke" data-smoke="1" d="M140 69c22-16-14-28 5-47" fill="none" stroke="#d8f3ec" stroke-width="3" stroke-linecap="round"/><path class="smoke" data-smoke="2" d="M168 78c-20-14 15-30-4-48" fill="none" stroke="#d8f3ec" stroke-width="3" stroke-linecap="round"/></g>
      <path d="M65 180h150l-16 49c-4 12-16 18-30 18H111c-14 0-26-6-30-18Z" fill="url(#bronze)" stroke="#d3a052" stroke-width="2"/><ellipse cx="140" cy="180" rx="76" ry="23" fill="#a66631" stroke="#e0ad5c" stroke-width="3"/><ellipse cx="140" cy="180" rx="61" ry="14" fill="#352016"/>
      <g class="sticks"><g data-stick="0"><rect class="stick" x="108" y="77" width="7" height="105" rx="3.5" fill="#8f3e2d"/><rect class="ember" x="108" y="75" width="7" height="7" rx="3.5" fill="#ff7540"/></g><g data-stick="1"><rect class="stick" x="136.5" y="68" width="7" height="114" rx="3.5" fill="#9b4430"/><rect class="ember" x="136.5" y="66" width="7" height="7" rx="3.5" fill="#ff7540"/></g><g data-stick="2"><rect class="stick" x="165" y="77" width="7" height="105" rx="3.5" fill="#8f3e2d"/><rect class="ember" x="165" y="75" width="7" height="7" rx="3.5" fill="#ff7540"/></g></g>
      <path d="M64 180Q140 207 216 180L213 191Q140 216 67 191Z" fill="#92582b" stroke="#dda95a" stroke-width="2"/><circle cx="112" cy="180" r="6" fill="#6f4327"/><circle cx="140" cy="180" r="6" fill="#6f4327"/><circle cx="168" cy="180" r="6" fill="#6f4327"/><path d="M101 224h78" stroke="#d69a47" stroke-width="3" stroke-linecap="round" opacity=".55"/></svg>
  </div><div class="stats"><div class="number" id="incenseCount">0</div><div class="label">今日已上香</div><div class="status" id="burnStatus">点击敬上三炷香</div></div></div><div class="hint">燃烧中再次点击，将换上新的三炷香</div>
</section>
</main><script>
(()=>{'use strict';const BURN_MS=180000,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],state={page:'home',fish:0,incense:0,pendingFish:0,fishTimer:null,burnTimer:null};const fish=$('#fish'),incense=$('#incense'),fishCount=$('#fishCount'),incenseCount=$('#incenseCount');
for(let i=0;i<24;i++){const p=document.createElement('i');p.className='particle';p.style.cssText=`left:${Math.random()*100}%;top:${80+Math.random()*50}%;animation-duration:${12+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;$('#particles').appendChild(p)}const d=new Date(),week='日一二三四五六';$$('.sharedDate').forEach(e=>e.textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${week[d.getDay()]}`);
let audio;function tone(type){try{audio||=new(AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type==='fish'?'triangle':'sine';o.frequency.setValueAtTime(type==='fish'?500:820,t);o.frequency.exponentialRampToValueAtTime(type==='fish'?140:410,t+.25);g.gain.setValueAtTime(type==='fish'?.34:.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.4)}catch{}}function animate(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),900)}function pop(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function openPage(page){state.page=page;$$('.page').forEach(p=>p.classList.toggle('active',p.dataset.page===page))}$$('[data-open]').forEach(b=>b.onclick=()=>openPage(b.dataset.open));$$('.back').forEach(b=>b.onclick=()=>openPage('home'));
async function load(){for(const mode of['fish','incense'])try{const x=await fetch(mode==='fish'?'/api/count':'/api/incense').then(r=>r.json());state[mode]=x.count;(mode==='fish'?fishCount:incenseCount).textContent=x.count}catch{}resumeBurn()}async function flushFish(){const n=state.pendingFish;state.pendingFish=0;if(!n)return;try{const x=await fetch('/api/knock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({increment:n})}).then(r=>r.json());state.fish=x.count;fishCount.textContent=x.count}catch{}}async function postIncense(){try{const x=await fetch('/api/incense',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"increment":1}'}).then(r=>r.json());state.incense=x.count;incenseCount.textContent=x.count}catch{}}
function actFish(){tone('fish');state.fish++;state.pendingFish++;fishCount.textContent=state.fish;pop(fishCount);$('#fishFloat').textContent=['功德 +1','善哉','随喜','阿弥陀佛'][Math.floor(Math.random()*4)];animate(fish,'hit');clearTimeout(state.fishTimer);state.fishTimer=setTimeout(flushFish,700)}
const original=[{y:77,h:105,ey:75,sy:0},{y:68,h:114,ey:66,sy:-9},{y:77,h:105,ey:75,sy:0}];function renderBurn(){const end=Number(localStorage.getItem('zen-incense-end')||0),left=Math.max(0,end-Date.now()),ratio=left/BURN_MS;if(!left){incense.classList.remove('burning');$('#burnStatus').textContent='香已燃尽 · 点击重新上香';clearInterval(state.burnTimer);state.burnTimer=null;localStorage.removeItem('zen-incense-end');return}incense.classList.add('burning');$$('.stick').forEach((el,i)=>{const o=original[i],h=Math.max(3,o.h*ratio),y=182-h;el.setAttribute('y',y);el.setAttribute('height',h);const ember=$$('[data-stick]')[i].querySelector('.ember');ember.setAttribute('y',y-2);$$('[data-smoke]')[i].setAttribute('transform',`translate(0 ${y-o.y})`)});const sec=Math.ceil(left/1000);$('#burnStatus').textContent=`燃烧中 · ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function resumeBurn(){if(Number(localStorage.getItem('zen-incense-end')||0)>Date.now()){renderBurn();clearInterval(state.burnTimer);state.burnTimer=setInterval(renderBurn,250)}else renderBurn()}function actIncense(){tone('incense');localStorage.setItem('zen-incense-end',String(Date.now()+BURN_MS));state.incense++;incenseCount.textContent=state.incense;pop(incenseCount);$('#incenseFloat').textContent=['三炷清香','一念清净','心安','自在'][Math.floor(Math.random()*4)];animate(incense,'relit');postIncense();resumeBurn()}
fish.onclick=actFish;incense.onclick=actIncense;document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&state.page!=='home'){e.preventDefault();state.page==='fish'?actFish():actIncense()}});addEventListener('beforeunload',flushFish);load()})();
</script></body></html>
