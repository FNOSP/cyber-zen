async function postCicada(count){return fetch('/api/cicada',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({count})}).then(r=>r.json())}async function loadCicada(){try{const x=await fetch('/api/cicada').then(r=>r.json()),local=Number(localStorage.getItem(waaKey)||0);waa=Math.max(local,x.count);if(waa>x.count)await postCicada(waa);localStorage.setItem(waaKey,String(waa));waaCount.textContent=waa}catch{}}function saveCicada(){localStorage.setItem(waaKey,String(waa));void postCicada(waa).catch(()=>{})}function beaconCicada(){navigator.sendBeacon('/api/cicada',new Blob([JSON.stringify({count:waa})],{type:'application/json'}))}
function ensureCicadaAudio(){try{audio||=new(AudioContext||webkitAudioContext)();if(cicadaOsc)return;cicadaOsc=audio.createOscillator();cicadaGain=audio.createGain();cicadaFilter=audio.createBiquadFilter();cicadaOsc.type='sawtooth';cicadaOsc.frequency.value=72;cicadaFilter.type='bandpass';cicadaFilter.frequency.value=980;cicadaFilter.Q.value=2.8;cicadaGain.gain.value=.0001;cicadaOsc.connect(cicadaFilter).connect(cicadaGain).connect(audio.destination);cicadaOsc.start()}catch{}}
function countWaa(delta){manualArc+=Math.abs(delta);while(manualArc>=Math.PI*2){manualArc-=Math.PI*2;waa++;waaCount.textContent=waa;pop(waaCount);saveCicada()}}
function pointerAngle(e){const r=canvas.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))}function moveToy(e){if(!dragging)return;const a=pointerAngle(e),now=performance.now(),raw=Math.atan2(Math.sin(a-lastPointerAngle),Math.cos(a-lastPointerAngle));lastPointerAngle=a;const dt=Math.max(.008,(now-lastFrame)/1000);toySpeed=toySpeed*.55+(raw/dt)*.45;toyAngle+=raw;countWaa(raw);updateCicadaStatus();e.preventDefault()}

function roundedRect(x,y,w,h,r){cx.beginPath();cx.roundRect(x,y,w,h,r);cx.fill();cx.stroke()}function drawCicada(){cx.clearRect(0,0,560,500);const ax=280,ay=245,rx=142,ry=122,tx=ax+Math.cos(toyAngle)*rx,ty=ay+Math.sin(toyAngle)*ry;cx.save();cx.strokeStyle='rgba(103,213,201,.14)';cx.lineWidth=2;cx.setLineDash([8,12]);cx.beginPath();cx.ellipse(ax,ay,rx,ry,0,0,Math.PI*2);cx.stroke();cx.restore();cx.strokeStyle='#d5b16b';cx.lineWidth=4;cx.beginPath();cx.moveTo(ax,ay);cx.quadraticCurveTo((ax+tx)/2+Math.sin(toyAngle)*18,(ay+ty)/2-Math.cos(toyAngle)*18,tx,ty);cx.stroke();cx.save();cx.translate(ax,ay);cx.rotate(-.18);cx.fillStyle='#9b642e';cx.strokeStyle='#e0ad5e';cx.lineWidth=3;roundedRect(-62,-15,124,30,14);cx.fillStyle='#42c7ba';cx.beginPath();cx.arc(0,0,6,0,Math.PI*2);cx.fill();cx.restore();cx.save();cx.translate(tx,ty);cx.rotate(toyAngle+Math.PI/2);const grad=cx.createLinearGradient(-42,-62,42,62);grad.addColorStop(0,'#e7b760');grad.addColorStop(.48,'#a9682e');grad.addColorStop(1,'#4f2d17');cx.fillStyle=grad;cx.strokeStyle='#edc779';cx.lineWidth=3;roundedRect(-42,-61,84,122,25);cx.fillStyle='#24170f';cx.beginPath();cx.ellipse(0,-47,31,9,0,0,Math.PI*2);cx.fill();cx.strokeStyle='#42cfc0';cx.lineWidth=3;cx.beginPath();cx.moveTo(0,-24);cx.lineTo(0,31);cx.stroke();cx.fillStyle='#67d9ca';cx.beginPath();cx.ellipse(0,4,13,22,0,0,Math.PI*2);cx.fill();cx.strokeStyle='#cba05b';cx.lineWidth=3;for(const side of[-1,1]){cx.beginPath();cx.moveTo(side*7,-8);cx.quadraticCurveTo(side*30,-19,side*30,9);cx.quadraticCurveTo(side*28,28,side*7,20);cx.stroke()}cx.restore()}
function cicadaLoop(now){const dt=Math.min(.04,(now-lastFrame)/1000||.016);lastFrame=now;if(autoCicada){toySpeed+=(AUTO_SPEED-toySpeed)*Math.min(1,dt*4)}else if(!dragging)toySpeed*=Math.pow(.9,dt*60);toyAngle+=autoCicada?toySpeed*dt:0;drawCicada();const turns=Math.abs(toySpeed)/(Math.PI*2),audible=state.page==='cicada'&&turns>.5;if(cicadaGain&&audio){const t=audio.currentTime,target=audible?Math.min(.18,(turns-.5)*.075):.0001;cicadaGain.gain.setTargetAtTime(target,t,.06);cicadaOsc.frequency.setTargetAtTime(64+Math.min(110,turns*24),t,.05);cicadaFilter.frequency.setTargetAtTime(850+Math.sin(toyAngle)*320+Math.min(850,turns*180),t,.04)}if(Math.floor(now/150)!==Math.floor((now-dt*1000)/150))updateCicadaStatus();requestAnimationFrame(cicadaLoop)}requestAnimationFrame(cicadaLoop);
